name: Sky & Max - Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android-apk:
  steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Release Keystore from GitHub Secrets
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Android Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          gradle :app:assembleRelease --stacktrace

      - name: Rename and Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-artifacts/sky-max-jarvis-release.apk \;
          echo "APK prepared in release-artifacts/sky-max-jarvis-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sky-max-jarvis-apk
          path: release-artifacts/sky-max-jarvis-release.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/sky-max-jarvis-release.apk
          name: "Sky & Max JARVIS Release ${{ github.ref_name }}"
          body: |
            ## Sky & Max AI Assistant - Android Release
            
            ### What's New:
            - Dual AI Persona (Sky & Max) with native voice conversation & wake words.
            - Full Hindi & multilingual speech support with distinct pitch modulation.
            - Long-term memory vault with offline SD Card export/import.
            - Caring reminders & witty humor schedule.
            - FM Radio synthesizer (87.5 - 108 MHz) & Live TV streaming.
            - In-App GitHub Releases Auto-Updater.
            
            ### Installation:
            1. Download `sky-max-jarvis-release.apk` directly to your Android device.
            2. Open the downloaded APK and tap **Install** (allow unknown sources if prompted).
            3. On first launch, tap **Authorize All** to grant permissions.
          draft: false
          prerelease: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
